# ===== 面板自定义规则（2026-08-23，通过面板编辑）=====
# 追加的白名单 UA（额外放行的爬虫/工具）
map $http_user_agent $user_whitelist_ua {
    default 0;
}
# 追加的黑名单 UA（额外拦截的扫描器/攻击工具）
map $http_user_agent $user_blacklist_ua {
    default 0;
}
# 追加的黑名单路径（额外拦截的攻击路径）
map $uri $user_blacklist_uri {
    default 0;
}
