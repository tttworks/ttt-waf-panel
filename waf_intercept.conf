# ===== WAF 拦截 + 全量记录（2026-08-29 部署，面板接入）=====
if ($final_blacklist_ua = 1) { return 403; }
if ($final_blacklist_uri = 1) { return 403; }
add_header X-WAF-Rule $rule_hit always;
access_log /www/wwwlogs/waf_full.log waf_full;
limit_req zone=seo_crawl burst=10 nodelay;
