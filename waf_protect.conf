# ===== WAF 增强（2026-08-29 合并）：webp 缓存区分 + 评论限流 =====
map $http_accept $cache_vary {
    default "";
    ~*image/webp "w";
}
limit_req_zone $binary_remote_addr zone=wpcomments:10m rate=10r/m;

limit_req_zone $binary_remote_addr zone=wplogin:10m rate=10r/m;

# ===== WordPress 基础防护（2026-08-23 升级版，规则可编辑）=====
# 面板自定义规则（www 可编辑，见 waf_rules_user.conf）
include /www/wwwroot/wafpanel/waf_rules_user.conf;

# 白名单：主流搜索引擎 + 安全 AI 爬虫（明确放行）
map $http_user_agent $whitelist_ua {
    "~*(Googlebot|Google-InspectionTool|Bingbot|Baiduspider|Sogou|360Spider|YisouSpider|Bytespider|ByteSpider|Shenma|DuckDuckBot|YandexBot|Slurp|Applebot|PetalBot|facebookexternalhit|Facebot|Twitterbot|LinkedInBot|CCBot|Amazonbot|AdsBot-Google|Mediapartners-Google|GPTBot|ChatGPT-User|OAI-SearchBot|ClaudeBot|Claude-Web|anthropic-ai|PerplexityBot|Google-Extended|GoogleOther|Applebot-Extended|cohere-ai|Meta-ExternalAgent|DeepSeekBot|TongyiBot|Doubao)" 1;
    default 0;
}
# 黑名单：安全扫描器/攻击工具（拦截）
map $http_user_agent $blacklist_ua {
    "~*(nmap|nikto|sqlmap|masscan|nessus|acunetix|openvas|zgrab|gobuster|dirbuster|wpscan|wordfence|libwww-perl|scrapy)" 1;
    default 0;
}
# 黑名单：恶意请求路径（拦截）
map $uri $blacklist_uri {
    default 0;
    "~*(/xmlrpc\.php$|/wp-admin/setup-config\.php|/wp-content/uploads/.*\.php|/\.env|/\.git|/phpmyadmin|/wp-config\.php\.bak|/wp-json/wp/v2/users)" 1;
}

# 合并用户规则：任一命中即视为命中
# 最终 blacklist_ua = 内置 或 用户追加
map "$blacklist_ua$user_blacklist_ua" $final_blacklist_ua {
    default 0;
    "10" 1; "01" 1; "11" 1;
}
map "$blacklist_uri$user_blacklist_uri" $final_blacklist_uri {
    default 0;
    "10" 1; "01" 1; "11" 1;
}
map "$whitelist_ua$user_whitelist_ua" $final_whitelist_ua {
    default 0;
    "10" 1; "01" 1; "11" 1;
}

# 规则命中类型（优先级：黑名单路径 > 黑名单UA > 白名单UA）
map "$final_blacklist_uri$final_blacklist_ua$final_whitelist_ua" $rule_hit {
    "111" blacklist_uri;
    "110" blacklist_uri;
    "101" blacklist_uri;
    "100" blacklist_uri;
    "011" blacklist_ua;
    "010" blacklist_ua;
    "001" whitelist_ua;
    "000" none;
}

# WAF 拦截判断
map "$final_blacklist_uri$final_blacklist_ua" $is_waf_block {
    default 0;
    "10" 1;
    "01" 1;
    "11" 1;
}

# 全量访问日志格式
log_format waf_full '$remote_addr|$time_local|"$host|$request_method|$request_uri"|$status|"$http_user_agent"|"$http_referer"|$rule_hit|$body_bytes_sent';

# SEO 爬虫限流（AhrefsBot / meta-externalagent 全局限速；正常用户用 $request_id 唯一键，不受影响）
map $http_user_agent $seo_key {
    "~*AhrefsBot"          "ahrefs";
    "~*meta-externalagent" "meta";
    default $request_id;
}
limit_req_zone $seo_key zone=seo_crawl:10m rate=15r/m;
